version: "3.9"

services:
  web:
    build: .
    container_name: gaadi-web
    env_file:
      - .env
    restart: unless-stopped
    environment:
      GUNICORN_WORKERS: 3
      GUNICORN_TIMEOUT: 60
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: gaadi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
