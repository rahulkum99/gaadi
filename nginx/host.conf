# Host nginx (already bound to :80 / :443 on EC2).
# Copy to /etc/nginx/sites-available/gaadi and enable:
#   sudo ln -sf /etc/nginx/sites-available/gaadi /etc/nginx/sites-enabled/gaadi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker nginx stays on 127.0.0.1:8080 so it does not fight this process for port 80.

server {
    listen 80;
    server_name api.broll.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
